name: AI Radio AutoDJ

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: 

jobs:
  run-dj:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 取得專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝必要套件
        run: |
          pip install google-generativeai edge-tts asyncio

      - name: 執行 AI DJ 產生腳本
        env:
          ai: ${{ secrets.ai }}
        run: |
          python update_radio.py

      - name: 自動將生成的 MP3 存回倉庫
        run: |
          git config --global user.name "AI Radio Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add dj_speech.mp3
          git commit -m "Auto-update AI DJ speech [skip ci]" || echo "No changes to commit"
          git push
